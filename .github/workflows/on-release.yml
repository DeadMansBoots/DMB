name: Notify other repos of release
on:
  release:
    types: [published]
jobs:
  notify_repos:
    # DMB: this tells VCMI's Homebrew repository about VCMI's releases; a DMB release has no token
    # for it and nothing to announce there
    if: ${{ !github.event.release.prerelease && github.repository == 'vcmi/vcmi' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch only for releases
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TOKEN_SECRET }}
          repository: vcmi/homebrew-vcmi
          event-type: on-release
          client-payload: '{"release": ${{ toJson(github.event.release) }}}'
